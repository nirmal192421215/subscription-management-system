{% extends 'brightloop/base.html' %}

{% block title %}Pay Invoice {{ invoice.invoice_number }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto space-y-6">
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
        <div class="flex items-center space-x-2 pb-4 border-b border-slate-100 mb-6">
            <span class="p-2 rounded-xl bg-emerald-100 text-emerald-700">
                <i class="fa-solid fa-lock text-lg"></i>
            </span>
            <div>
                <h1 class="text-xl font-bold text-slate-900">Secure Online Checkout</h1>
                <p class="text-xs text-slate-500">Invoice: <strong class="text-purple-700 font-mono">{{ invoice.invoice_number }}</strong></p>
            </div>
        </div>

        <div class="p-4 bg-purple-50 rounded-xl border border-purple-100 mb-6 flex justify-between items-center text-xs">
            <span class="text-purple-900 font-bold">Outstanding Balance:</span>
            <span class="font-mono font-black text-xl text-purple-900">${{ invoice.balance_due|floatformat:2 }}</span>
        </div>

        <form method="POST" class="space-y-4 text-xs">
            {% csrf_token %}

            <div>
                <label class="block font-semibold text-slate-700 mb-1">Amount to Pay ($)</label>
                <input type="number" step="0.01" name="amount" value="{{ invoice.balance_due }}" max="{{ invoice.balance_due }}" min="0.01" required
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#714B67] focus:outline-none font-mono text-base font-bold text-slate-900">
            </div>

            <div>
                <label class="block font-semibold text-slate-700 mb-1">Payment Method</label>
                <div class="grid grid-cols-3 gap-2">
                    <label class="border border-slate-200 hover:border-purple-300 p-2.5 rounded-xl flex flex-col items-center justify-center cursor-pointer text-center">
                        <input type="radio" name="payment_method" value="credit_card" checked class="text-[#714B67] mb-1">
                        <span class="font-bold text-[11px]"><i class="fa-solid fa-credit-card"></i> Card</span>
                    </label>
                    <label class="border border-slate-200 hover:border-purple-300 p-2.5 rounded-xl flex flex-col items-center justify-center cursor-pointer text-center">
                        <input type="radio" name="payment_method" value="bank_transfer" class="text-[#714B67] mb-1">
                        <span class="font-bold text-[11px]"><i class="fa-solid fa-building-columns"></i> Wire</span>
                    </label>
                    <label class="border border-slate-200 hover:border-purple-300 p-2.5 rounded-xl flex flex-col items-center justify-center cursor-pointer text-center">
                        <input type="radio" name="payment_method" value="paypal" class="text-[#714B67] mb-1">
                        <span class="font-bold text-[11px]"><i class="fa-brands fa-paypal"></i> PayPal</span>
                    </label>
                </div>
            </div>

            <div>
                <label class="block font-semibold text-slate-700 mb-1">Card / Account Reference</label>
                <input type="text" name="reference" placeholder="e.g. Card ending in 4242"
                    class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#714B67] focus:outline-none">
            </div>

            <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
                <a href="{% url 'portal_invoice_detail' invoice.id %}" class="text-xs text-slate-500 hover:underline">Cancel</a>
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-bold shadow-md transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Confirm ${{ invoice.balance_due|floatformat:2 }} Payment</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
