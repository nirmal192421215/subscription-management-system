{% extends 'brightloop/base.html' %}

{% block title %}New Tax Rule - Brightloop Software{% endblock %}

{% block content %}
<div class="max-w-md mx-auto space-y-6">
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
        <div class="pb-4 border-b border-slate-100 mb-6">
            <h1 class="text-xl font-bold text-slate-900">Create Tax Rule</h1>
            <p class="text-xs text-slate-500">Admin rule for automatic tax calculation on recurring invoices</p>
        </div>

        <form method="POST" class="space-y-4 text-xs">
            {% csrf_token %}
            <div>
                <label class="block font-semibold text-slate-700 mb-1">Tax Rule Name</label>
                <input type="text" name="name" required placeholder="e.g. Standard State VAT (10%)"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#714B67] focus:outline-none">
            </div>

            <div>
                <label class="block font-semibold text-slate-700 mb-1">Percentage Rate (%)</label>
                <input type="number" step="0.01" name="rate" required placeholder="10.00"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#714B67] focus:outline-none font-mono">
            </div>

            <div>
                <label class="block font-semibold text-slate-700 mb-1">Description</label>
                <textarea name="description" rows="2" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#714B67] focus:outline-none" placeholder="Applies to software services..."></textarea>
            </div>

            <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-100">
                <a href="{% url 'tax_rule_list' %}" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold transition">Cancel</a>
                <button type="submit" class="px-5 py-2.5 rounded-xl bg-[#714B67] hover:bg-[#5c3d54] text-white font-bold shadow-md transition">Create Tax Rule</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
