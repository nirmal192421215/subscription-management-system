{% extends 'brightloop/base.html' %}

{% block title %}New Quotation Template - Brightloop Software{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
        <div class="pb-4 border-b border-slate-100 mb-6">
            <h1 class="text-xl font-bold text-slate-900">Create Quotation Template</h1>
            <p class="text-xs text-slate-500">Reusable offers with pre-configured plans, products, and validity duration</p>
        </div>

        <form method="POST" class="space-y-5 text-xs">
            {% csrf_token %}

            <div>
                <label class="block font-semibold text-slate-700 mb-1">Template Name</label>
                <input type="text" name="name" required placeholder="e.g. Enterprise Multi-Seat Onboarding Package"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#714B67] focus:outline-none">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Target Plan</label>
                    <select name="plan_id" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#714B67] focus:outline-none">
                        {% for p in plans %}
                        <option value="{{ p.id }}">{{ p.name }} (${{ p.cost }} / {{ p.get_billing_interval_display }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Validity (Days)</label>
                    <input type="number" name="valid_days" value="15" min="1" required
                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#714B67] focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block font-semibold text-slate-700 mb-1">Default Product Line</label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <div>
                        <select name="line_product_id" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none">
                            {% for p in products %}
                            <option value="{{ p.id }}">{{ p.name }} (${{ p.sales_price }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <input type="number" name="line_quantity" value="1" min="1" placeholder="Quantity" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none">
                    </div>
                </div>
            </div>

            <div>
                <label class="block font-semibold text-slate-700 mb-1">Template Notes / Terms</label>
                <textarea name="notes" rows="3" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#714B67] focus:outline-none" placeholder="Standard package terms..."></textarea>
            </div>

            <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-100">
                <a href="{% url 'template_list' %}" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold transition">Cancel</a>
                <button type="submit" class="px-5 py-2.5 rounded-xl bg-[#714B67] hover:bg-[#5c3d54] text-white font-bold shadow-md transition">Save Template</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
