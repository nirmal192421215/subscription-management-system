{% extends 'brightloop/base.html' %}

{% block title %}New Subscription - Brightloop Software{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
        <div class="flex items-center space-x-2 pb-4 border-b border-slate-100 mb-6">
            <span class="p-2 rounded-xl bg-purple-100 text-[#714B67]">
                <i class="fa-solid fa-file-circle-plus text-lg"></i>
            </span>
            <div>
                <h1 class="text-xl font-bold text-slate-900">Create New Subscription / Quote</h1>
                <p class="text-xs text-slate-500">Configure customer, billing plan, and contract parameters</p>
            </div>
        </div>

        <form method="POST" class="space-y-6 text-xs">
            {% csrf_token %}

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Customer / Client</label>
                    <select name="customer_id" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#714B67] focus:outline-none text-xs">
                        <option value="">-- Select Customer --</option>
                        {% for c in customers %}
                        <option value="{{ c.id }}">{{ c.display_name }} ({{ c.email }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Subscription Plan</label>
                    <select name="plan_id" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#714B67] focus:outline-none text-xs">
                        <option value="">-- Select Recurring Plan --</option>
                        {% for p in plans %}
                        <option value="{{ p.id }}">{{ p.name }} (${{ p.cost }} / {{ p.get_billing_interval_display }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Start Date</label>
                    <input type="date" name="start_date" value="{{ today }}" required class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#714B67] focus:outline-none">
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Expiry Date (Optional)</label>
                    <input type="date" name="expiry_date" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#714B67] focus:outline-none">
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Payment Terms</label>
                    <select name="payment_terms" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#714B67] focus:outline-none">
                        <option value="immediate">Immediate Payment</option>
                        <option value="net_15">15 Days (Net 15)</option>
                        <option value="net_30" selected>30 Days (Net 30)</option>
                        <option value="net_60">60 Days (Net 60)</option>
                    </select>
                </div>
            </div>

            <!-- Initial Line Items -->
            <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                <div class="flex items-center justify-between">
                    <span class="font-bold text-slate-700 uppercase tracking-wider text-[11px]">Primary Product Line</span>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-slate-500 mb-1">Product</label>
                        <select name="line_product_id" required class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none">
                            {% for p in products %}
                            <option value="{{ p.id }}">{{ p.name }} (${{ p.sales_price }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-500 mb-1">Variant (e.g. Brand)</label>
                        <select name="line_variant_id" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none">
                            <option value="">Base Product</option>
                            {% for p in products %}
                                {% for v in p.variants.all %}
                                <option value="{{ v.id }}">{{ p.name }} &rarr; {{ v.attribute_name }}: {{ v.variant_value }} (+${{ v.price_extra }})</option>
                                {% endfor %}
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-500 mb-1">Quantity</label>
                        <input type="number" name="line_quantity" min="1" value="1" required class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:outline-none">
                    </div>
                </div>
            </div>

            <div>
                <label class="block font-semibold text-slate-700 mb-1">Notes / Terms</label>
                <textarea name="notes" rows="3" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-[#714B67] focus:outline-none" placeholder="Special requirements or service level agreement details..."></textarea>
            </div>

            <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-100">
                <a href="{% url 'subscription_list' %}" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold transition">
                    Cancel
                </a>
                <button type="submit" class="px-5 py-2.5 rounded-xl bg-[#714B67] hover:bg-[#5c3d54] text-white font-bold shadow-md transition">
                    Create Subscription
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
